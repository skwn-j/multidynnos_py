[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multidynnos-py"
version = "0.1.0"
description = "Python port of the core MultiDynNoS temporal graph drawing algorithm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "networkx>=3.0", "scipy>=1.10"]
license = "Apache-2.0"

[project.optional-dependencies]
fast = ["numba>=0.61"]
test = ["pytest>=7"]

[project.scripts]
multidynnos = "multidynnos_py.cli:main"

[tool.setuptools]
packages = ["multidynnos_py"]
package-dir = {multidynnos_py = "."}
