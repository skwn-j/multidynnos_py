[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multidynnos-py"
version = "0.1.0"
description = "Python research port scaffolding for MultiDynNoS dynamic graph data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MultiDynNoS Python Port Contributors" }
]
license = { text = "Apache-2.0" }
keywords = ["dynamic-graphs", "graph-drawing", "multidynnos"]
dependencies = ["matplotlib>=3.10", "numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[project.scripts]
multidynnos-py = "multidynnos_py.cli:main"

[tool.setuptools.packages.find]
include = ["multidynnos_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
