<script>
'use strict';
(() => {
  const root = document.documentElement;
  const byId = id => document.getElementById(id);
  const slider = byId('snapshot');
  const strip = byId('strip');
  const palette = ['#3678a0', '#3f8c78', '#8d6bb1', '#b16a55', '#799144', '#b27a35', '#607bb1', '#a95d84'];

  function validate(payload) {
    if (!payload || !Array.isArray(payload.snapshots) || !payload.snapshots.length) {
      throw new Error('No snapshot data is embedded in this viewer.');
    }
    for (const axis of ['x', 'y']) {
      const range = payload.bounds && payload.bounds[axis];
      if (!Array.isArray(range) || range.length !== 2 || !range.every(Number.isFinite) || range[1] < range[0]) {

      }
    }

        throw new Error('Invalid snapshot coordinates.');
      }

        throw new Error('Snapshot coordinates must be finite numbers.');
      }

  function nodeColor(id) {

    heading.className = 'heading';

    title.textContent = 'Snapshot ' + (index + 1);

    byId('next').disabled = current === data.snapshots.length - visibleCount;

  function activateNearby() {
    const first = Math.max(0, Math.floor(strip.scrollLeft / (panelWidth + gap)) - 1);
    const last = Math.min(views.length - 1, first + visibleCount + 2);
    for (let index = first; index <= last; index++) active.add(index);
    for (const index of active) {
      if (index < first || index > last) {
        active.delete(index);
        views[index].canvas.width = views[index].canvas.height = 1;
        views[index].canvas.dataset.rendered = 'false';
      }
    }
    requestDraw();
  }

  function resize() {
    if (!views) return;
    const width = Math.max(1, strip.clientWidth - 2);
    const requested = Math.max(1, Math.floor(Number(data.visible_columns) || 4));
    const mobileLimit = window.innerWidth < 760 ? Math.max(1, Math.floor(width / 240)) : requested;
    visibleCount = Math.min(views.length, requested, mobileLimit);
    panelWidth = Math.max(1, (width - gap * (visibleCount - 1)) / visibleCount);
    strip.style.setProperty('--panel-width', panelWidth + 'px');
    slider.max = String(views.length - visibleCount + 1);
    slider.disabled = views.length <= visibleCount;
    root.dataset.visibleColumns = visibleCount;
    select(current);
  }

  function fitVisible() {
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
    for (const view of views.slice(current, current + visibleCount)) {
      for (let index = 0; index < view.snapshot.xy.length; index++) {
        if (!nodeVisible(view, index)) continue;
        const [x, y] = view.snapshot.xy[index];
        xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
        ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
      }
    }
    if (Number.isFinite(xmin)) setBounds({x: [xmin, xmax], y: [ymin, ymax]});
  }

  function bindCanvas(view) {
    const {canvas, snapshot} = view;
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const size = metrics(view), rect = canvas.getBoundingClientRect();
      if (!size) return;
      const x = event.clientX - rect.left, y = event.clientY - rect.top;
      const wx = camera.cx + (x - size.w / 2) / size.k;
      const wy = camera.cy - (y - size.h / 2) / size.k;
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? size.h : 1;
      const factor = Math.exp(Math.max(-.6, Math.min(.6, event.deltaY * unit * .001)));
      const reference = Math.max(data.bounds.x[1] - data.bounds.x[0], data.bounds.y[1] - data.bounds.y[0], 1);
      if (Math.max(camera.sx, camera.sy) * factor < reference * 1e-5 || Math.max(camera.sx, camera.sy) * factor > reference * 1e5) return;
      camera.sx *= factor; camera.sy *= factor;
      const nextScale = size.k / factor;
      camera.cx = wx - (x - size.w / 2) / nextScale;
      camera.cy = wy + (y - size.h / 2) / nextScale;
      requestDraw();
    }, {passive: false});
    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      const size = metrics(view);
      if (!size) return;
      canvas.setPointerCapture(event.pointerId);
      drag = {id: event.pointerId, canvas, x: event.clientX, y: event.clientY, cx: camera.cx, cy: camera.cy, k: size.k};
    });
    canvas.addEventListener('pointermove', event => {
      if (drag && drag.id === event.pointerId && drag.canvas === canvas) {
        camera.cx = drag.cx - (event.clientX - drag.x) / drag.k;
        camera.cy = drag.cy + (event.clientY - drag.y) / drag.k;
        requestDraw();
        return;
      }
      const size = metrics(view), rect = canvas.getBoundingClientRect();
      if (!size) return;
      const x = event.clientX - rect.left, y = event.clientY - rect.top;
      let closest = -1, distance = 64;
      snapshot.xy.forEach((point, index) => {
        if (!nodeVisible(view, index)) return;
        const dx = size.w / 2 + (point[0] - camera.cx) * size.k - x;
        const dy = size.h / 2 - (point[1] - camera.cy) * size.k - y;
        const squared = dx * dx + dy * dy;
        if (squared < distance) { distance = squared; closest = index; }
      });
      byId('hover').textContent = closest < 0 ? '' : 'Snapshot ' + (view.index + 1) + ' · Node ' + snapshot.ids[closest] + ' · (' + number(snapshot.xy[closest][0]) + ', ' + number(snapshot.xy[closest][1]) + ')';
    });
    const release = event => { if (drag && drag.id === event.pointerId && drag.canvas === canvas) drag = null; };
    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(name, release);
    canvas.addEventListener('pointerleave', () => { if (!drag) byId('hover').textContent = ''; });
  }

  try {
    data = validate(JSON.parse(byId('data').textContent));
    data.maximum_nodes = data.snapshots.reduce((maximum, snapshot) => Math.max(maximum, snapshot.ids.length), 0);
    byId('title').textContent = data.title || 'Snapshot viewer';
    byId('source').textContent = data.source || '';
    byId('source').title = data.source || '';
    document.title = (data.title || 'Snapshot viewer') + ' · Snapshots';
    root.dataset.snapshotCount = data.snapshots.length;
    views = data.snapshots.map(makeView);
    updateNodeVisibility();
    setBounds(data.bounds);
    resize();
    if ('IntersectionObserver' in window) {
      observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          const index = Number(entry.target.dataset.snapshot) - 1;
          if (entry.isIntersecting) active.add(index);
          else {
            active.delete(index);
            views[index].canvas.width = views[index].canvas.height = 1;
            views[index].canvas.dataset.rendered = 'false';
          }
        }
        requestDraw();
      }, {root: strip, rootMargin: '0px 80px'});
      views.forEach(view => observer.observe(view.panel));
    }
    slider.addEventListener('input', () => select(Number(slider.value) - 1));
    byId('previous').addEventListener('click', () => select(current - 1));
    byId('next').addEventListener('click', () => select(current + 1));
    byId('reset').addEventListener('click', () => setBounds(data.bounds));
    byId('fit').addEventListener('click', fitVisible);
    byId('edges').addEventListener('change', requestDraw);
    byId('isolated').addEventListener('change', () => {
      showIsolated = byId('isolated').checked;
      updateNodeVisibility();
    });
    strip.addEventListener('scroll', () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = 0;
        updateRange(strip.scrollLeft / (panelWidth + gap));
        activateNearby();
      });
    }, {passive: true});
    strip.addEventListener('keydown', event => {
      if (event.target !== strip) return;
      let target;
      if (event.key === 'ArrowLeft') target = current - 1;
      if (event.key === 'ArrowRight') target = current + 1;
      if (event.key === 'Home') target = 0;
      if (event.key === 'End') target = views.length - visibleCount;
      if (target !== undefined) { event.preventDefault(); select(target); }
    });
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(strip);
    else window.addEventListener('resize', resize);
  } catch (error) { fail(error); }
})();
</script>
</body>
</html>
